# German is the application default locale. All user-facing text lives here.
# Rails ships no German translations, so the reachable core keys are defined here too.
de:
  date:
    formats:
      default: "%d.%m.%Y"
      short: "%d.%m."
      long: "%d. %B %Y"
    # Indexed by Date#wday, where 0 is Sunday — this order is required by Rails and must not
    # be rotated. The week itself starts on Monday and ends on Sunday; that is
    # config.beginning_of_week in config/application.rb, not this array.
    day_names: [Sonntag, Montag, Dienstag, Mittwoch, Donnerstag, Freitag, Samstag]
    abbr_day_names: [So, Mo, Di, Mi, Do, Fr, Sa]
    month_names: [~, Januar, Februar, März, April, Mai, Juni, Juli, August, September, Oktober, November, Dezember]
    abbr_month_names: [~, Jan, Feb, Mär, Apr, Mai, Jun, Jul, Aug, Sep, Okt, Nov, Dez]

  time:
    formats:
      default: "%d.%m.%Y %H:%M"
      short: "%d.%m. %H:%M"
      long: "%d. %B %Y, %H:%M"

  errors:
    format: "%{attribute} %{message}"
    messages:
      blank: "muss ausgefüllt werden"
      taken: "ist bereits vergeben"
      confirmation: "stimmt nicht mit %{attribute} überein"
      inclusion: "ist kein gültiger Wert"
      too_short: "ist zu kurz (mindestens %{count} Zeichen)"
      too_long: "ist zu lang (höchstens %{count} Zeichen)"
      greater_than: "muss grösser als %{count} sein"
      not_a_number: "ist keine Zahl"
      invalid: "ist nicht korrekt"
      unchanged: "ist bereits die aktuelle Adresse"

  activerecord:
    models:
      user: "Benutzer"
      concert: "Konzert"
      registration: "Anmeldung"
      activity: "Aktivität"
    attributes:
      user:
        name: "Name"
        email_address: "E-Mail-Adresse"
        unconfirmed_email: "Neue E-Mail-Adresse"
        password: "Passwort"
        password_confirmation: "Passwort-Bestätigung"
        password_challenge: "Aktuelles Passwort"
        role: "Rolle"
      concert:
        title: "Titel"
        description: "Beschreibung"
        setlist: "Setlist"
        playlist_url: "Playlist-Link"
        capacity: "Kapazität"
        status: "Status"
        starts_at: "Beginn"
        ends_at: "Ende"
        creator: "Ersteller"
      registration:
        user: "Teilnehmer"
        concert: "Konzert"
        created_at: "Anmeldezeitpunkt"
      activity:
        action: "Aktion"
        actor: "Ausgeführt von"
        concert: "Konzert"
        created_at: "Zeitpunkt"
        details: "Änderungen"
    errors:
      # Message of ActiveRecord::RecordInvalid itself. Rails ships no German for it, and with
      # raise_on_missing_translations the test suite trips over that.
      messages:
        record_invalid: "Validierung fehlgeschlagen: %{errors}"
      models:
        concert:
          attributes:
            base:
              not_publishable: "Dieses Konzert kann nicht mehr veröffentlicht werden."
              not_cancellable: "Dieses Konzert kann nicht mehr abgesagt werden."
            capacity:
              below_occupancy:
                one: "kann nicht unter die aktuelle Belegung von einer Anmeldung gesenkt werden"
                other: "kann nicht unter die aktuelle Belegung von %{count} Anmeldungen gesenkt werden"
            ends_at:
              after_starts_at: "muss nach dem Beginn liegen"
            playlist_url:
              invalid: "muss mit http:// oder https:// beginnen"
        registration:
          attributes:
            base:
              closed: "Für dieses Konzert sind keine Anmeldungen möglich."
              full: "Dieses Konzert ist bereits ausgebucht."
              duplicate: "Du bist für dieses Konzert bereits angemeldet."

  # Flash messages for requests that were stopped before they reached their action.
  authorization:
    denied: "Für diese Aktion fehlt dir die Berechtigung."
    not_found: "Dieser Eintrag existiert nicht mehr."

  # Role names as agreed in the glossary of docs/spec/PROJECT.md.
  roles:
    user: "Teilnehmer"
    organizer: "Organisator"
    admin: "Administrator"

  layout:
    brand: "EventDesk"
    sign_in: "Anmelden"
    sign_up: "Konto erstellen"
    sign_out: "Abmelden"
    profile: "Profil"
    concerts: "Konzerte"
    my_registrations: "Meine Anmeldungen"
    user_management: "Benutzerverwaltung"
    activities: "Aktivitäten"

